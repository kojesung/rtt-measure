name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install dpkt
      - run: python tests/test_real_rounds.py
      - run: python tests/test_budget.py
      - run: python tests/test_payload.py
      - run: python tests/run_cases.py skills/rtt-measure/scripts/analyze.py
