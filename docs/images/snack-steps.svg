<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<rect width="720" height="380" rx="12" fill="#ffffff"/>
<text x="360.0" y="32" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">봉지 수는 무게에 비례하지 않고 계단처럼 바뀝니다</text>
<line x1="70" y1="310.0" x2="690" y2="310.0" stroke="#eef2f7"/>
<text x="58" y="315.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">3봉지</text>
<line x1="70" y1="247.5" x2="690" y2="247.5" stroke="#eef2f7"/>
<text x="58" y="252.5" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">4봉지</text>
<line x1="70" y1="185.0" x2="690" y2="185.0" stroke="#eef2f7"/>
<text x="58" y="190.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">5봉지</text>
<line x1="70" y1="122.5" x2="690" y2="122.5" stroke="#eef2f7"/>
<text x="58" y="127.5" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">6봉지</text>
<line x1="70" y1="60.0" x2="690" y2="60.0" stroke="#eef2f7"/>
<text x="58" y="65.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">7봉지</text>
<text x="70.0" y="332" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">300g</text>
<text x="263.75" y="332" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">400g</text>
<text x="457.5" y="332" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">500g</text>
<text x="651.25" y="332" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">600g</text>
<rect x="263.75" y="60" width="193.75" height="250" fill="#f59e0b" opacity="0.10"/>
<polyline points="70.0,247.5 263.8,247.5 263.8,185.0 457.5,185.0 457.5,122.5 651.2,122.5 651.2,60.0 690.0,60.0" fill="none" stroke="#b45309" stroke-width="3"/>
<circle cx="321.875" cy="185.0" r="7" fill="#b45309"/>
<text x="321.875" y="169.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">지금 430g</text>
<defs><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="am" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs>
<path d="M313.875,189.0 C301.875,216.25 273.75,228.75 263.75,241.5" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
<circle cx="263.75" cy="247.5" r="6" fill="#16a34a"/>
<text x="253.75" y="273.5" font-size="14" fill="#16a34a" text-anchor="end" font-weight="bold">30g 줄이면 4봉지</text>
<line x1="325.875" y1="215.0" x2="453.5" y2="215.0" stroke="#6b7280" stroke-width="2" marker-end="url(#am)"/>
<text x="389.6875" y="237.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">70g까지 늘려도 5봉지</text>
<text x="465.5" y="112.5" font-size="13" fill="#dc2626" text-anchor="start" font-weight="normal">+80g부터 6봉지</text>
<text x="360.0" y="362" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal">10g, 20g을 줄이는 노력은 봉지 수를 바꾸지 못합니다. 경계를 넘을 때만 한 봉지가 사라집니다.</text>
</svg>
